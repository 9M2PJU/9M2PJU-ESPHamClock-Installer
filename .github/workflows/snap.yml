name: 📦 Build & Publish Snap

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Snap (${{ matrix.architecture }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - amd64
          - arm64
          - armhf

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Install Snapcraft
        run: |
          sudo snap install snapcraft --classic --channel 8.x/stable

      - name: 🔧 Enable Multi-Arch Package Sources
        if: matrix.architecture != 'amd64'
        run: |
          ARCH="${{ matrix.architecture }}"
          case "$ARCH" in
            arm64) DEB_ARCH="arm64" ;;
            armhf) DEB_ARCH="armhf" ;;
          esac
          sudo dpkg --add-architecture "$DEB_ARCH"
          sudo apt-get update -qq

      - name: 📦 Build Snap
        id: snapcraft
        run: |
          snapcraft pack --destructive-mode --platform ${{ matrix.architecture }}
          echo "snap=$(ls *.snap)" >> $GITHUB_OUTPUT

      - name: 📤 Upload Snap Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snap-${{ matrix.architecture }}
          path: ${{ steps.snapcraft.outputs.snap }}

      - name: 🚀 Publish to Snap Store
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && env.SNAPCRAFT_STORE_CREDENTIALS != ''
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          release: candidate
